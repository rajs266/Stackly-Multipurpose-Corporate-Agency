<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Stackly Multipurpose Corporate Agency</title>
  <link rel="icon" type="image/webp" href="assets/top-logo.webp">

  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Orbitron:wght@800;900&family=Outfit:wght@800;900&family=Plus+Jakarta+Sans:wght@600;700;800&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">

  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css">

  
  <link rel="stylesheet" href="style.css?v=7.0">

  
  <style>
    html, body {
      height: 100vh;
      max-height: 100vh;
      overflow: hidden !important;
    }

    body.page-404-standalone {
      background-color: #08090a;
      min-height: 100vh;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      margin: 0;
      padding: 0;
    }

    /* Ambient Background Glows */
    .glow-blob-primary {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, rgba(191, 247, 71, 0.14) 0%, rgba(110, 193, 228, 0.07) 45%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
      z-index: 1;
      filter: blur(40px);
      animation: pulseGlow 8s infinite alternate ease-in-out;
    }

    .glow-blob-cyan {
      position: absolute;
      top: 20%;
      right: 15%;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(110, 193, 228, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
      z-index: 1;
      filter: blur(45px);
    }

    @keyframes pulseGlow {
      0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.7; }
      100% { transform: translate(-50%, -50%) scale(1.12); opacity: 1; }
    }

    /* Background Interactive Grid Canvas */
    #bgAnimationCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Stage Container (Compact height to guarantee zero scrollbar) */
    .error-stage-wrapper {
      position: relative;
      z-index: 5;
      max-width: 760px;
      width: 92%;
      padding: 1.25rem 1rem;
      text-align: center;
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out;
      margin: auto 0;
    }

    /* Holographic Radar Pulse Rings */
    .radar-rings-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 420px;
      height: 420px;
      pointer-events: none;
      z-index: 0;
    }

    .radar-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px solid rgba(191, 247, 71, 0.12);
      animation: radarExpand 4s infinite linear;
    }

    .radar-ring:nth-child(1) { width: 170px; height: 170px; animation-delay: 0s; }
    .radar-ring:nth-child(2) { width: 280px; height: 280px; animation-delay: 1.33s; }
    .radar-ring:nth-child(3) { width: 390px; height: 390px; animation-delay: 2.66s; }

    @keyframes radarExpand {
      0% { transform: translate(-50%, -50%) scale(0.6); opacity: 0.8; border-color: rgba(191, 247, 71, 0.35); }
      100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; border-color: rgba(110, 193, 228, 0.05); }
    }

    /* Status Badge (Positioned down close to 404 text) */
    .badge-cyber-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0.4rem 1.15rem;
      border-radius: 100px;
      background: rgba(191, 247, 71, 0.08);
      border: 1px solid rgba(191, 247, 71, 0.25);
      color: #BFF747;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 0.5rem;
      margin-bottom: 0.25rem;
      box-shadow: 0 0 16px rgba(191, 247, 71, 0.15);
      backdrop-filter: blur(8px);
    }

    .badge-dot-glow {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #BFF747;
      box-shadow: 0 0 8px #BFF747, 0 0 14px #BFF747;
      animation: dotBlink 1.5s infinite alternate;
    }

    @keyframes dotBlink {
      0% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
    }

    /* Fuzzy Text Containers (Tight vertical spacing) */
    #fuzzyTextContainer {
      position: relative;
      z-index: 2;
      margin: 0 auto -6px auto;
      user-select: none;
      line-height: 1;
    }

    #fuzzyTextNotFoundContainer {
      position: relative;
      z-index: 2;
      margin: -6px auto 0.85rem auto;
      user-select: none;
      line-height: 1;
    }

    /* Short Concise Description */
    .error-desc {
      color: #94a3b8;
      font-size: clamp(0.9rem, 1.5vw, 1.05rem);
      line-height: 1.6;
      max-width: 480px;
      margin: 0 auto 1.6rem auto;
    }

    /* Action Buttons Container (ONLY 2 BUTTONS) */
    .action-buttons-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      position: relative;
      z-index: 10;
    }

    /* Button 1: Back to Home (Primary Lime Pill) */
    .btn-404-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0.8rem 1.9rem;
      border-radius: 100px;
      background: linear-gradient(135deg, #BFF747 0%, #a2e820 100%);
      color: #0b0b0b !important;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: -0.01em;
      border: none;
      text-decoration: none;
      box-shadow: 0 0 20px rgba(191, 247, 71, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.4);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .btn-404-home::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      transition: left 0.6s ease;
    }

    .btn-404-home:hover::before {
      left: 100%;
    }

    .btn-404-home:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 0 30px rgba(191, 247, 71, 0.6), 0 8px 20px rgba(0, 0, 0, 0.4);
      color: #000000 !important;
    }

    .btn-404-home i {
      transition: transform 0.3s ease;
    }

    .btn-404-home:hover i {
      transform: scale(1.15) rotate(-8deg);
    }

    /* Button 2: Go Back (Secondary Translucent Cyber Button) */
    .btn-404-back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0.8rem 1.9rem;
      border-radius: 100px;
      background: rgba(255, 255, 255, 0.04);
      color: #ffffff !important;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: -0.01em;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      cursor: pointer;
      text-decoration: none;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-404-back:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(191, 247, 71, 0.5);
      color: #BFF747 !important;
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 0 20px rgba(191, 247, 71, 0.2), 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .btn-404-back i {
      transition: transform 0.3s ease;
    }

    .btn-404-back:hover i {
      transform: translateX(-4px);
    }

    /* Top Brand Watermark */
    .brand-watermark {
      position: absolute;
      top: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      opacity: 0.85;
      transition: opacity 0.3s ease;
    }

    .brand-watermark:hover {
      opacity: 1;
    }

    .brand-watermark img {
      height: 34px;
      width: auto;
      object-fit: contain;
    }
  </style>
</head>

<body class="page-404-standalone">

  
  <div id="stackly-preloader">
    <div class="preloader-bg-glow"></div>
    <div class="preloader-bg-glow-secondary"></div>
    <div class="preloader-grid-lines"></div>
    <div class="preloader-particles">
      <span class="spark-dot"></span>
      <span class="spark-dot"></span>
      <span class="spark-dot"></span>
      <span class="spark-dot"></span>
      <span class="spark-dot"></span>
    </div>
    <div class="preloader-content">
      <div class="preloader-circle-wrapper">
        <div class="circle-ring ring-outer-spin"></div>
        <div class="circle-ring ring-middle-pulse"></div>
        <div class="circle-ring ring-inner-orbit">
          <span class="orbit-dot dot-1"></span>
          <span class="orbit-dot dot-2"></span>
          <span class="orbit-dot dot-3"></span>
          <span class="orbit-dot dot-4"></span>
        </div>
        <div class="preloader-logo-box">
          <img src="assets/top-logo.webp" alt="Stackly Logo" class="preloader-logo-img">
          <div class="logo-shimmer"></div>
        </div>
      </div>
      <div class="preloader-bar-container">
        <div class="preloader-progress-track">
          <div class="preloader-progress-fill" id="preloader-progress-fill">
            <div class="progress-glow-tip"></div>
          </div>
        </div>
        <div class="preloader-meta d-flex justify-content-between align-items-center mt-2">
          <span class="preloader-status-text" id="preloader-status-text">INITIALIZING ENTERPRISE ENVIRONMENT...</span>
          <span class="preloader-pct-badge"><span id="preloader-pct-num">0</span>%</span>
        </div>
      </div>
    </div>
  </div>

  
  <div class="custom-cursor-dot"></div>
  <div class="custom-cursor-ring"></div>

  
  <canvas id="bgAnimationCanvas"></canvas>

  
  <div class="glow-blob-primary"></div>
  <div class="glow-blob-cyan"></div>

  
  <a href="index.html" class="brand-watermark" aria-label="Stackly Home">
    <img src="assets/logo.webp" alt="Stackly Corporate">
  </a>

  
  <main class="error-stage-wrapper" id="errorStage">
    
    
    <div class="radar-rings-box">
      <div class="radar-ring"></div>
      <div class="radar-ring"></div>
      <div class="radar-ring"></div>
    </div>

    
    <div class="badge-cyber-status gsap-fade-up">
      <span class="badge-dot-glow"></span>
      ERROR 404 :: ROUTE UNREACHABLE
    </div>

    
    <div id="fuzzyTextContainer" class="gsap-zoom-in"></div>

    
    <div id="fuzzyTextNotFoundContainer" class="gsap-zoom-in"></div>

    
    <p class="error-desc gsap-fade-up">
      The requested page was moved, deleted, or does not exist in our system.
    </p>

    
    <div class="action-buttons-group gsap-fade-up">
      
      <a href="index.html" class="btn-404-home">
        <i class="fa-solid fa-house"></i>
        <span>Back to Home</span>
      </a>

      
      <button type="button" class="btn-404-back" onclick="history.back()">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Go Back</span>
      </button>
    </div>

  </main>

  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="main.js?v=7.0"></script>
</body>

</html>
